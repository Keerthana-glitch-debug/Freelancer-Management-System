<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FreelanceHub</title>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<div id="authScreen" class="screen">
  <div class="auth-container">
    <div class="brand"><div class="brand-icon">💼</div><h1>FreelanceHub</h1><p>Connect. Work. Grow.</p></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••"/></div>
      <button class="btn-primary full" onclick="doLogin()">Sign In</button>
      <p class="hint">Default admin: admin@example.com / Admin123</p>
    </div>
    <div id="registerForm" class="hidden">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Jane Doe"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="jane@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Min 6 characters"/></div>
      <div class="form-group"><label>Role</label>
        <select id="regRole" onchange="toggleFreelancerFields()">
          <option value="CLIENT">Client – Post projects & hire</option>
          <option value="FREELANCER">Freelancer – Bid & work</option>
          <option value="ADMIN">Admin – Manage system</option>
        </select>
      </div>
      <div class="form-group"><label>Initial Wallet ($)</label><input type="number" id="regWallet" value="500" min="0"/></div>
      <div id="freelancerFields" class="hidden">
        <div class="form-group"><label>Skills</label><input type="text" id="regSkills" placeholder="Java, Python, UI/UX..."/></div>
        <div class="form-group"><label>Bio / Portfolio Summary</label><textarea id="regBio" placeholder="Tell clients about yourself..."></textarea></div>
      </div>
      <button class="btn-primary full" onclick="doRegister()">Create Account</button>
    </div>
    <div id="authMsg" class="msg hidden"></div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <nav class="sidebar">
    <div class="sidebar-brand">💼 FreelanceHub</div>
    <div class="user-chip" id="navUser"></div>
    <ul class="nav-links" id="navLinks"></ul>
    <div class="sidebar-footer">
      <button class="btn-outline full" onclick="logout()">🚪 Logout</button>
    </div>
  </nav>
  <main class="content" id="pageContent"></main>
</div>

<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
